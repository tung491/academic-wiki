[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-scholar-mcp"
version = "0.1.0"
description = "Minimal MCP server exposing Semantic Scholar search, DOI lookup, and related-paper discovery."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tung Son Do"}]
dependencies = [
    "fastmcp>=3.1.1",
    "requests>=2.31",
]

[project.scripts]
semantic-scholar-mcp = "semantic_scholar_mcp.server:main"

[tool.setuptools]
packages = ["semantic_scholar_mcp", "semantic_scholar_mcp.tools"]

[tool.setuptools.package-dir]
semantic_scholar_mcp = "."
"semantic_scholar_mcp.tools" = "tools"
